<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิเคราะห์ผลงาน - S Leasing</title>
<style>
  :root{
    --bg:#EEF0F3; --card:#FFFFFF; --ink:#1A2333; --ink-soft:#6B7482;
    --line:#E4E7EC; --accent:#0F6656; --accent-deep:#0C5245;
    --gold:#B8860B; --danger:#C0392B; --blue:#2C6E9B;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;}

  header{
    position:sticky;top:0;z-index:10;background:var(--card);
    border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  header h1{font-size:18px;margin:0;font-weight:800;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .range-sel{
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;
  }
  button.btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:9px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-weight:700;font-family:inherit;
  }
  button.btn:active{transform:scale(.96);}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

  .wrap{max-width:1200px;margin:0 auto;padding:22px 24px 50px;}

  /* การ์ดตัวเลขสรุป */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .stat{background:var(--card);border-radius:16px;padding:20px;border-left:4px solid var(--accent);}
  .stat.c-new{border-left-color:var(--accent);}
  .stat.c-claimed{border-left-color:var(--gold);}
  .stat.c-done{border-left-color:var(--danger);}
  .stat.c-time{border-left-color:var(--blue);}
  .stat .s-label{font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
  .stat .s-value{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .stat .s-unit{font-size:15px;font-weight:600;color:var(--ink-soft);margin-left:4px;}

  .panel{background:var(--card);border-radius:16px;padding:22px;margin-bottom:22px;}
  .panel h2{font-size:16px;margin:0 0 18px;font-weight:800;}

  /* กราฟ timeline */
  .chart{width:100%;overflow-x:auto;}
  svg{display:block;}
  .legend{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:11px;height:11px;border-radius:3px;}

  /* ตารางอันดับ */
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:12px 10px;font-size:14px;border-bottom:1px solid var(--line);}
  th{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .rank-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;
    background:var(--bg);color:var(--ink-soft);margin-right:10px;
  }
  .rank-1 .rank-badge{background:#FCF3D9;color:var(--gold);}
  .rank-2 .rank-badge{background:#EDEFF2;color:#7A8290;}
  .rank-3 .rank-badge{background:#F6E7DC;color:#B06A3B;}
  .admin-cell{display:flex;align-items:center;}
  .admin-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-right:10px;flex-shrink:0;}
  .admin-avatar img{width:100%;height:100%;object-fit:cover;}
  .bar-cell{min-width:120px;}
  .bar-track{background:var(--bg);border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;border-radius:6px;transition:width .5s ease;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .loading{text-align:center;padding:60px;color:var(--ink-soft);}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate.hidden{display:none;}
  .gate-card{background:var(--card);border-radius:16px;padding:34px 30px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(26,35,51,.12);}
  .gate-card .brand{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:24px;font-weight:800;line-height:56px;margin:0 auto 18px;}
  .gate-card h2{font-size:19px;margin:0 0 6px;}
  .gate-card p{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .gate-card input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;font-family:inherit;background:#FBFBFC;color:var(--ink);}
  .gate-card input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .gate-card button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .gate-card .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;}

  @media (max-width:820px){ .stats{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .stats{grid-template-columns:1fr;} .bar-cell{display:none;} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="brand">S</div>
    <h2>วิเคราะห์ผลงานทีม</h2>
    <p>กรุณาใส่ชื่อผู้ใช้ที่ได้รับมอบหมาย</p>
    <input type="text" id="userInput" placeholder="ชื่อผู้ใช้" autocomplete="off" autocapitalize="off">
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<header>
  <h1>วิเคราะห์ผลงานทีม</h1>
  <div class="header-right">
    <select class="range-sel" id="rangeSel">
      <option value="1">วันนี้</option>
      <option value="7" selected>7 วันล่าสุด</option>
      <option value="14">14 วันล่าสุด</option>
      <option value="30">30 วันล่าสุด</option>
    </select>
    <button class="btn" id="refreshBtn">รีเฟรช</button>
  </div>
</header>

<div class="wrap" id="content">
  <div class="loading" id="loading">กำลังโหลดข้อมูล...</div>

  <div id="dashboard" style="display:none;">
    <div class="stats">
      <div class="stat c-new"><div class="s-label">ลูกค้าเข้าใหม่</div><div class="s-value" id="stNew">0<span class="s-unit">เคส</span></div></div>
      <div class="stat c-claimed"><div class="s-label">รับเคสแล้ว</div><div class="s-value" id="stClaimed">0<span class="s-unit">เคส</span></div></div>
      <div class="stat c-done"><div class="s-label">ปิดเคสแล้ว</div><div class="s-value" id="stDone">0<span class="s-unit">เคส</span></div></div>
      <div class="stat c-time"><div class="s-label">เวลาเฉลี่ยต่อเคส</div><div class="s-value" id="stTime">0<span class="s-unit">นาที</span></div></div>
    </div>

    <div class="panel">
      <h2>ทามไลน์รายวัน</h2>
      <div class="chart" id="chart"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent)"></span>เคสเข้าใหม่</span>
        <span><span class="dot" style="background:var(--danger)"></span>ปิดเคส</span>
      </div>
    </div>

    <div class="panel">
      <h2>อันดับผลงานแอดมิน</h2>
      <div id="rankingWrap"></div>
    </div>
  </div>
</div>

<script>
// ===== ตั้งค่าตรงนี้ =====
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvjmsN19ZHE5qoKOnOfa_2PyusdU9tmYJFX4oiDnj7a1WX3gZ6_wiy55lmTXM70yrB/exec";
// =========================

let me = null;

function api(params){
  const qs = new URLSearchParams(params).toString();
  return fetch(`${APPS_SCRIPT_URL}?${qs}`).then(r => r.json());
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadInsight(){
  const days = document.getElementById('rangeSel').value;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  try{
    const d = await api({ action:'insight', days });
    if(!d.ok) throw new Error();
    renderInsight(d);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }catch(err){
    document.getElementById('loading').textContent = 'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง';
  }
}

function renderInsight(d){
  document.getElementById('stNew').innerHTML = d.totalNew + '<span class="s-unit">เคส</span>';
  document.getElementById('stClaimed').innerHTML = d.totalClaimed + '<span class="s-unit">เคส</span>';
  document.getElementById('stDone').innerHTML = d.totalDone + '<span class="s-unit">เคส</span>';
  document.getElementById('stTime').innerHTML = d.avgHandleMin + '<span class="s-unit">นาที</span>';
  renderChart(d.timeline);
  renderRanking(d.ranking);
}

// กราฟแท่งคู่ (เคสเข้า vs ปิด) วาดด้วย SVG
function renderChart(timeline){
  const chart = document.getElementById('chart');
  if(!timeline || !timeline.length){ chart.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }

  const w = Math.max(timeline.length * 64, 600), h = 240, pad = 30, padB = 40;
  const maxV = Math.max(1, ...timeline.map(t => Math.max(t.newCases, t.doneCases)));
  const bw = 14, gap = 4;
  const stepX = (w - pad*2) / timeline.length;
  const scaleY = (h - pad - padB) / maxV;

  let bars = '', labels = '', grid = '';
  // เส้น grid แนวนอน 4 เส้น
  for(let g=0; g<=4; g++){
    const val = Math.round(maxV/4*g);
    const y = h - padB - val*scaleY;
    grid += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#E4E7EC" stroke-width="1"/>`;
    grid += `<text x="${pad-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B7482">${val}</text>`;
  }
  timeline.forEach((t, i) => {
    const cx = pad + stepX*i + stepX/2;
    const hN = t.newCases*scaleY, hD = t.doneCases*scaleY;
    const x1 = cx - bw - gap/2, x2 = cx + gap/2;
    bars += `<rect x="${x1}" y="${h-padB-hN}" width="${bw}" height="${hN}" rx="3" fill="#0F6656"><title>${t.date}: เข้าใหม่ ${t.newCases}</title></rect>`;
    bars += `<rect x="${x2}" y="${h-padB-hD}" width="${bw}" height="${hD}" rx="3" fill="#C0392B"><title>${t.date}: ปิด ${t.doneCases}</title></rect>`;
    labels += `<text x="${cx}" y="${h-padB+18}" text-anchor="middle" font-size="11.5" fill="#6B7482">${t.date}</text>`;
  });

  chart.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${bars}${labels}</svg>`;
}

function renderRanking(ranking){
  const wrap = document.getElementById('rankingWrap');
  if(!ranking || !ranking.length){ wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูลผลงาน</div>'; return; }
  const maxDone = Math.max(1, ...ranking.map(r => r.done));

  let rows = '';
  ranking.forEach((r, i) => {
    const rankClass = i < 3 ? `rank-${i+1}` : '';
    const av = (r.name || '?').trim().charAt(0);
    const barW = Math.round(r.done / maxDone * 100);
    rows += `<tr class="${rankClass}">
      <td><span class="rank-badge">${i+1}</span></td>
      <td><div class="admin-cell"><span class="admin-avatar">${escapeHtml(av)}</span>${escapeHtml(r.name)}</div></td>
      <td class="num">${r.claimed}</td>
      <td class="num">${r.done}</td>
      <td class="num">${r.percent}%</td>
      <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${barW}%"></div></div></td>
    </tr>`;
  });
  wrap.innerHTML = `<table>
    <thead><tr><th style="width:50px;">อันดับ</th><th>แอดมิน</th><th class="num">รับเคส</th><th class="num">ปิดเคส</th><th class="num">สัดส่วน</th><th class="bar-cell">ผลงาน</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

document.getElementById('rangeSel').addEventListener('change', loadInsight);
document.getElementById('refreshBtn').addEventListener('click', loadInsight);

// ===== login (ใช้ระบบเดียวกับหน้าคิว) =====
async function tryLogin(){
  const val = document.getElementById('userInput').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if(!val){ err.textContent = 'กรุณาใส่ชื่อผู้ใช้'; return; }
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  err.textContent = '';
  try{
    const res = await api({ action:'login', username: val });
    if(res.ok){
      me = { username: res.username, displayName: res.displayName, avatarUrl: res.avatarUrl || '' };
      try{ sessionStorage.setItem('sl_me', JSON.stringify(me)); }catch(e){}
      document.getElementById('gate').classList.add('hidden');
      loadInsight();
    } else {
      err.textContent = res.message || 'ไม่พบชื่อผู้ใช้นี้';
    }
  }catch(e){
    err.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง';
  }finally{
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('userInput').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });

// เช็ค login ที่จำไว้ใน session (key เดียวกับหน้าคิว) — เปิดจากปุ่มวิเคราะห์แล้วเข้าเลย
(function initAuth(){
  try{
    const saved = sessionStorage.getItem('sl_me');
    if(saved){
      me = JSON.parse(saved);
      if(me && me.username){
        document.getElementById('gate').classList.add('hidden');
        loadInsight();
        return;
      }
    }
  }catch(e){}
  document.getElementById('userInput').focus();
})();
</script>
</body>
</html>
