<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการคิว - S Leasing</title>
<style>
  :root{
    --bg:#EEF0F3;
    --card:#FFFFFF;
    --ink:#1A2333;
    --ink-soft:#6B7482;
    --line:#E4E7EC;
    --accent:#0F6656;
    --accent-deep:#0C5245;
    --danger:#C0392B;
    --danger-deep:#A93226;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;}

  header{
    position:sticky;top:0;z-index:10;background:var(--card);
    border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .who{display:flex;align-items:center;gap:12px;}
  .who .avatar{
    width:46px;height:46px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:20px;font-weight:700;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .who .label{font-size:11.5px;color:var(--ink-soft);}
  .who .name{font-size:16px;font-weight:800;line-height:1.2;}
  .count-pill{
    font-size:13px;color:var(--accent);font-weight:700;
    background:#E7F1EE;padding:5px 13px;border-radius:20px;white-space:nowrap;
  }
  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);}
  .live .dot{width:8px;height:8px;border-radius:50%;background:#33B679;animation:pulse 1.6s ease-in-out infinite;}
  .live.off .dot{background:var(--danger);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
  .search-box{position:relative;}
  .search-box input{
    border:1px solid var(--line);border-radius:9px;padding:8px 34px 8px 12px;
    font-size:14px;font-family:inherit;background:#FBFBFC;width:200px;color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search-box .icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;pointer-events:none;}
  .filter-sel{
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;
  }
  button.btn-refresh{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:9px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-weight:700;font-family:inherit;
  }
  button.btn-refresh:active{transform:scale(.96);}
  button.btn-logout{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit;
  }

  .subbar{padding:16px 24px 4px;display:flex;align-items:center;gap:12px;}
  .subbar h2{font-size:16px;margin:0;font-weight:800;}

  .list{padding:14px 24px 40px;display:flex;flex-direction:column;gap:14px;max-width:1500px;}

  .row{
    display:flex;align-items:stretch;background:var(--card);border-radius:14px;
    overflow:hidden;box-shadow:0 2px 8px rgba(26,35,51,.05);
    animation:rowIn .4s cubic-bezier(.2,.8,.2,1) both;
    transition:opacity .38s ease, transform .38s ease;
  }
  .row.leaving{opacity:0;transform:translateX(24px);}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .row .qhead{
    background:var(--accent);color:#fff;padding:10px 20px;min-width:220px;
    display:flex;align-items:center;gap:16px;transition:background .3s ease;
  }
  .row.doing .qhead{background:var(--accent-deep);}
  .row.waitinfo .qhead{background:#B8860B;}
  .row.done .qhead{background:#6B7482;}
  .row .qhead .avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    border:2px solid rgba(255,255,255,.5);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.12);
  }
  .row .qhead .avatar img{width:100%;height:100%;object-fit:cover;}
  .row .qhead .qmeta .qlabel{font-size:11.5px;opacity:.82;}
  .row .qhead .qmeta .qcode{font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.15;}

  .row .fields{
    flex:1;display:flex;align-items:center;gap:8px;padding:0 8px;
    min-width:0;overflow-x:auto;
  }
  .row .field{padding:10px 20px;border-left:1px solid var(--line);min-width:150px;}
  .row .field:first-child{border-left:none;}
  .row .field .k{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .row .field .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row .field .v.name-v{font-size:17px;}

  .row .actions{display:flex;align-items:center;gap:10px;padding:10px 20px;flex-shrink:0;}
  .row .actions button{
    border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;
    cursor:pointer;border:1.5px solid transparent;transition:all .18s ease;
    font-family:inherit;white-space:nowrap;
  }
  .row .actions button:active{transform:scale(.95);}
  /* ===== 3 ปุ่มสถานะ ===== */
  .row .actions button{
    border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:700;
    cursor:pointer;border:1.5px solid var(--line);transition:all .16s ease;
    font-family:inherit;white-space:nowrap;background:#fff;color:var(--ink-soft);
  }
  .row .actions button:active{transform:scale(.95);}
  .row .actions button:disabled{cursor:default;}
  /* ปุ่ม active ตามสถานะ */
  .row.doing    .btn-wait{background:var(--accent);color:#fff;border-color:var(--accent);}      /* กำลังทำ */
  .row.waitinfo .btn-doing{background:var(--accent);color:#fff;border-color:var(--accent);}     /* รอข้อมูลเพิ่ม */
  .row.done     .btn-done{background:#fff;color:var(--danger);border-color:var(--danger);}       /* เสร็จแล้ว */
  /* ปุ่มเสร็จสิ้นตอนกำลังทำ/รอข้อมูล = แดงเต็ม (เจ้าของกดได้) */
  .row.doing .btn-done, .row.waitinfo .btn-done{background:var(--danger);color:#fff;border-color:var(--danger);}
  .row.doing .btn-done:hover, .row.waitinfo .btn-done:hover{background:var(--danger-deep);}
  /* สถานะ done: ปุ่ม 1-2 จางเทา */
  .row.done .btn-wait, .row.done .btn-doing{opacity:.5;}
  /* spinner ตอนกำลังรับเคส */
  .btn-loading{position:relative;color:transparent!important;}
  .btn-loading::after{
    content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;
    margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;
    border-radius:50%;animation:spin .6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* สถานะเสร็จแล้ว: การ์ดจางลง หัวเป็นสีเทา ป้ายเสร็จสิ้น */
  .row.done{opacity:.72;}
  .done-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#E7F1EE;color:var(--accent);font-weight:700;font-size:14px;
    padding:11px 18px;border-radius:9px;white-space:nowrap;
  }

  .empty{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
    background:var(--card);border-radius:14px;
  }
  .empty .big{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:all .3s ease;z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate.hidden{display:none;}
  .gate-card{
    background:var(--card);border-radius:16px;padding:34px 30px;max-width:360px;width:100%;
    text-align:center;box-shadow:0 8px 30px rgba(26,35,51,.12);
  }
  .gate-card .brand{
    width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    font-size:24px;font-weight:800;line-height:56px;margin:0 auto 18px;
  }
  .gate-card h2{font-size:19px;margin:0 0 6px;}
  .gate-card p{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .gate-card input{
    width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;text-align:center;font-family:inherit;background:#FBFBFC;color:var(--ink);
  }
  .gate-card input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .gate-card button{
    width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .gate-card button:disabled{opacity:.6;cursor:default;}
  .gate-card .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;}

  @media (max-width:720px){
    .row{flex-direction:column;}
    .row .qhead{min-width:0;}
    .row .fields{flex-wrap:wrap;}
    .row .field{border-left:none;border-top:1px solid var(--line);width:100%;}
    .row .actions{border-top:1px solid var(--line);justify-content:stretch;}
    .row .actions button{flex:1;}
    .search-box input{width:140px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* popup เคสถูกแย่ง */
  .taken-overlay{position:fixed;inset:0;background:rgba(26,35,51,.5);z-index:110;display:none;align-items:center;justify-content:center;padding:24px;}
  .taken-overlay.show{display:flex;}
  .taken-card{background:#fff;border-radius:16px;padding:28px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .taken-icon{width:52px;height:52px;border-radius:50%;background:#FCEBE8;color:var(--danger);font-size:28px;font-weight:800;line-height:52px;margin:0 auto 14px;}
  .taken-card h3{font-size:18px;margin:0 0 8px;color:var(--ink);}
  .taken-card p{font-size:14px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;}
  .taken-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="brand">S</div>
    <h2>เข้าสู่ระบบจัดการคิว</h2>
    <p>กรุณาใส่ชื่อผู้ใช้ที่ได้รับมอบหมาย</p>
    <input type="text" id="userInput" placeholder="ชื่อผู้ใช้" autocomplete="off" autocapitalize="off">
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<header>
  <div class="who">
    <div class="avatar" id="meAvatar">–</div>
    <div>
      <div class="label">ชื่อบัญชี</div>
      <div class="name" id="meName">—</div>
    </div>
  </div>
  <span class="count-pill" id="countPill">0 คิว</span>
  <div class="header-right">
    <div class="live" id="live"><span class="dot"></span><span id="liveLabel">อัปเดตอัตโนมัติ</span></div>
    <select class="filter-sel" id="filterSel">
      <option value="all">สถานะทั้งหมด</option>
      <option value="งานใหม่">งานใหม่</option>
      <option value="กำลังทำ">กำลังทำ</option>
      <option value="รอข้อมูลเพิ่ม">รอข้อมูลเพิ่ม</option>
      <option value="เสร็จแล้ว">เสร็จสิ้น</option>
    </select>
    <select class="filter-sel" id="ownerSel">
      <option value="all">ทุกบัญชี</option>
    </select>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหา ชื่อ/คิว/บัตร">
      <span class="icon">🔍</span>
    </div>
    <button class="btn-refresh" id="refreshBtn">รีเฟรช</button>
    <button class="btn-logout" id="logoutBtn">ออก</button>
  </div>
</header>

<div class="list" id="list"></div>

<div class="toast" id="toast"></div>

<script>
// ===== ตั้งค่าตรงนี้ =====
// URL ของ backend แอดมิน (Code-admin.gs) — คนละตัวกับ ticket-form ของลูกค้า
const APPS_SCRIPT_URL = "https://docs.google.com/spreadsheets/d/1yOoRGTZqlBXCeenwapzTdekXLge-CleF1XeNPvFGkLU/edit?usp=sharing";
// =========================

const API_URL = APPS_SCRIPT_URL;
const POLL_MS = 5000;

let tickets = [];
let me = null;
let allAdmins = [];   // รายชื่อแอดมินทั้งหมด (สำหรับ filter)
let busy = new Set();
let pollTimer = null;

function api(params){
  const qs = new URLSearchParams(params).toString();
  return fetch(`${API_URL}?${qs}`).then(r => r.json());
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function setLive(on, label){
  const el = document.getElementById('live');
  el.classList.toggle('off', !on);
  document.getElementById('liveLabel').textContent = label || (on ? 'อัปเดตอัตโนมัติ' : 'เชื่อมต่อไม่ได้');
}

function visibleTickets(){
  const f = document.getElementById('filterSel').value;
  const owner = document.getElementById('ownerSel').value;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return tickets.filter(t => {
    if(f !== 'all' && t.status !== f) return false;
    if(owner !== 'all'){
      if(t.ownerUser !== owner) return false;
    }
    if(q){
      const hay = `${t.ticketCode} ${t.fullname} ${t.idcard} ${t.contractno}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

// อัปเดตตัวเลือกบัญชีใน dropdown จากรายชื่อแอดมินทั้งหมด
function refreshOwnerOptions(){
  const sel = document.getElementById('ownerSel');
  const prev = sel.value;

  let html = '<option value="all">ทุกบัญชี</option>';
  allAdmins.forEach(a => {
    html += `<option value="${escapeHtml(a.username)}">${escapeHtml(a.displayName)}</option>`;
  });
  sel.innerHTML = html;
  if([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function render(){
  const list = document.getElementById('list');
  const items = visibleTickets();

  document.getElementById('countPill').textContent = `${tickets.length} คิว`;
  refreshOwnerOptions();

  if(items.length === 0){
    [...list.querySelectorAll('.row')].forEach(c => c.remove());
    if(!list.querySelector('.empty')){
      list.innerHTML = '<div class="empty"><div class="big">ไม่มีคิวที่ตรงเงื่อนไข</div>คิวใหม่จะปรากฏที่นี่อัตโนมัติ</div>';
    }
    return;
  }
  const emptyEl = list.querySelector('.empty');
  if(emptyEl) emptyEl.remove();

  const visibleCodes = new Set(items.map(t => t.ticketCode));

  [...list.querySelectorAll('.row')].forEach(rowEl => {
    if(!visibleCodes.has(rowEl.dataset.code)){
      rowEl.classList.add('leaving');
      setTimeout(() => rowEl.remove(), 380);
    }
  });

  items.forEach((t, idx) => {
    let rowEl = list.querySelector(`.row[data-code="${cssEscape(t.ticketCode)}"]`);
    if(!rowEl){
      rowEl = buildRow(t);
      const ref = list.querySelectorAll('.row')[idx];
      if(ref) list.insertBefore(rowEl, ref);
      else list.appendChild(rowEl);
    } else {
      updateRow(rowEl, t);
    }
  });
}

function cssEscape(s){ return String(s).replace(/"/g, '\\"'); }

function buildRow(t){
  const row = document.createElement('div');
  row.className = 'row' + rowStatusClass(t.status);
  row.dataset.code = t.ticketCode;
  const avatar = ownerAvatarHtml(t);
  row.innerHTML = `
    <div class="qhead">
      <div class="avatar" title="${t.ownerName ? 'เจ้าของ: ' + escapeHtml(t.ownerName) : 'ยังไม่มีเจ้าของ'}">${avatar}</div>
      <div class="qmeta">
        <div class="qlabel">รหัสคิวลูกค้า</div>
        <div class="qcode">${escapeHtml(t.ticketCode)}</div>
      </div>
    </div>
    <div class="fields">
      <div class="field"><div class="k">ชื่อลงทะเบียน</div><div class="v name-v">${escapeHtml(t.fullname)}</div></div>
      <div class="field"><div class="k">เลขบัตรประชาชน</div><div class="v">${escapeHtml(t.idcard)}</div></div>
      ${t.contractno ? `<div class="field"><div class="k">เลขที่สัญญา</div><div class="v">${escapeHtml(t.contractno)}</div></div>` : ''}
    </div>
    <div class="actions">${actionsHtml(t)}</div>`;
  bindRowActions(row, t);
  return row;
}

function rowStatusClass(status){
  if(status === 'กำลังทำ') return ' doing';
  if(status === 'รอข้อมูลเพิ่ม') return ' waitinfo';
  if(status === 'เสร็จแล้ว') return ' done';
  return ' new'; // งานใหม่
}

// 3 ปุ่ม -> map สถานะ:
//   "รอดำเนินการ" = กำลังทำ (รับเจ้าของ)
//   "อยู่ระหว่างดำเนินการ" = รอข้อมูลเพิ่ม
//   "เสร็จสิ้น" = เสร็จแล้ว
// เคสที่มีเจ้าของเป็นคนอื่น -> ปุ่ม disable
function actionsHtml(t){
  const mine = !t.ownerUser || (me && t.ownerUser === me.username);
  const dis = mine ? '' : 'disabled title="เคสนี้มีเจ้าของแล้ว"';
  return `
    <button class="btn-wait" ${dis}>รอดำเนินการ</button>
    <button class="btn-doing" ${dis}>อยู่ระหว่างดำเนินการ</button>
    <button class="btn-done" ${dis}>เสร็จสิ้น</button>`;
}

function bindRowActions(row, t){
  const bw = row.querySelector('.btn-wait');
  const bd = row.querySelector('.btn-doing');
  const dn = row.querySelector('.btn-done');
  if(bw) bw.addEventListener('click', () => setStatus(t.ticketCode, 'กำลังทำ'));
  if(bd) bd.addEventListener('click', () => setStatus(t.ticketCode, 'รอข้อมูลเพิ่ม'));
  if(dn) dn.addEventListener('click', () => setStatus(t.ticketCode, 'เสร็จแล้ว'));
}

// รูป avatar เจ้าของเคส: มีรูป -> โชว์รูป, มีชื่อแต่ไม่มีรูป -> ตัวอักษรแรก, ไม่มีเจ้าของ -> วงว่าง
function ownerAvatarHtml(t){
  if(t.ownerAvatar){
    return `<img src="${escapeHtml(t.ownerAvatar)}" alt="" onerror="this.parentNode.textContent='${t.ownerName ? escapeHtml(t.ownerName.charAt(0)) : ''}'">`;
  }
  if(t.ownerName){
    return `<span style="font-size:22px;font-weight:700;">${escapeHtml(t.ownerName.charAt(0))}</span>`;
  }
  return ''; // ยังไม่มีเจ้าของ = วงว่าง
}

function updateRow(row, t){
  // อัปเดต class สถานะ
  row.className = 'row' + rowStatusClass(t.status);
  row.dataset.code = t.ticketCode;
  // อัปเดตปุ่ม/ป้าย
  const actions = row.querySelector('.actions');
  if(actions){
    actions.innerHTML = actionsHtml(t);
    bindRowActions(row, t);
  }
  // อัปเดตรูปเจ้าของ
  const av = row.querySelector('.qhead .avatar');
  if(av){
    av.innerHTML = ownerAvatarHtml(t);
    av.title = t.ownerName ? 'เจ้าของ: ' + t.ownerName : 'ยังไม่มีเจ้าของ';
  }
}

// หาคิวใน tickets ตาม code
function findTicket(code){ return tickets.find(t => t.ticketCode === code); }

async function setStatus(ticketCode, status){
  if(busy.has(ticketCode)) return;
  const t = findTicket(ticketCode);
  if(!t) return;

  const isClaim = (status === 'กำลังทำ' && !t.ownerUser); // การกดที่แย่งเจ้าของ (ปุ่มรอดำเนินการ)
  busy.add(ticketCode);

  const row = document.querySelector(`.row[data-code="${cssEscape(ticketCode)}"]`);

  // ===== Optimistic: อัปเดตหน้าจอทันที =====
  const prev = { status: t.status, ownerUser: t.ownerUser, ownerName: t.ownerName, ownerAvatar: t.ownerAvatar };
  t.status = status;
  if(isClaim && me){ t.ownerUser = me.username; t.ownerName = me.displayName; t.ownerAvatar = me.avatarUrl || ''; }
  if(row) updateRow(row, t);

  // ถ้าเป็นการรับเคส -> โชว์ spinner ที่ปุ่มรอดำเนินการระหว่างรอ backend ยืนยัน (กันขึ้นชื่อผิด)
  if(isClaim && row){
    const b = row.querySelector('.btn-wait');
    if(b){ b.classList.add('btn-loading'); b.disabled = true; }
  }

  try{
    const res = await api({ action:'setStatus', ticketCode, status, username: (me && me.username) || '' });

    if(res.taken){
      // ถูกคนอื่นแย่งไปแล้ว -> rollback + popup
      t.status = 'กำลังทำ';
      t.ownerUser = res.ownerUser; t.ownerName = res.ownerName; t.ownerAvatar = res.ownerAvatar;
      if(row) updateRow(row, t);
      showTakenPopup(res.ownerName || 'แอดมินคนอื่น');
    } else if(!res.ok){
      // ล้มเหลวอื่นๆ -> rollback
      Object.assign(t, prev);
      if(row) updateRow(row, t);
      showToast(res.message || 'อัปเดตไม่สำเร็จ');
    } else {
      // สำเร็จ -> ยืนยันเจ้าของจริงจาก backend
      if(res.ownerUser !== undefined){ t.ownerUser = res.ownerUser; t.ownerName = res.ownerName; t.ownerAvatar = res.ownerAvatar; }
      if(row) updateRow(row, t);
    }
    // sync เงียบๆ เบื้องหลัง ไม่บล็อก UI
    loadSilent();
  }catch(err){
    Object.assign(t, prev);
    if(row) updateRow(row, t);
    showToast('เชื่อมต่อไม่สำเร็จ');
  }finally{
    busy.delete(ticketCode);
    if(row){
      const b = row.querySelector('.btn-wait');
      if(b){ b.classList.remove('btn-loading'); b.disabled = false; }
    }
  }
}

// popup แจ้งว่าเคสถูกคนอื่นรับไปแล้ว
function showTakenPopup(ownerName){
  let el = document.getElementById('takenPopup');
  if(!el){
    el = document.createElement('div');
    el.id = 'takenPopup';
    el.className = 'taken-overlay';
    el.innerHTML = `<div class="taken-card">
      <div class="taken-icon">!</div>
      <h3>เคสนี้ถูกรับไปแล้ว</h3>
      <p id="takenMsg"></p>
      <button id="takenClose">รับทราบ</button>
    </div>`;
    document.body.appendChild(el);
    el.querySelector('#takenClose').addEventListener('click', () => el.classList.remove('show'));
  }
  el.querySelector('#takenMsg').textContent = `คุณ ${ownerName} รับเคสนี้ไปก่อนแล้ว`;
  el.classList.add('show');
}

// โหลดลิสต์แบบเงียบ (ไม่โชว์ error UI) ใช้ sync หลัง optimistic
async function loadSilent(){
  try{
    const res = await api({ action:'list' });
    if(res.ok){ tickets = res.tickets; setLive(true); render(); }
  }catch(err){ /* เงียบ */ }
}

async function load(){
  try{
    const res = await api({ action:'list' });
    if(res.ok){
      tickets = res.tickets;
      setLive(true);
      render();
    }
  }catch(err){
    setLive(false);
  }
}

function startPolling(){ stopPolling(); pollTimer = setInterval(load, POLL_MS); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

document.addEventListener('visibilitychange', () => {
  if(document.hidden) stopPolling();
  else if(document.getElementById('gate').classList.contains('hidden')){ load(); startPolling(); }
});

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('filterSel').addEventListener('change', render);
document.getElementById('ownerSel').addEventListener('change', render);
document.getElementById('searchInput').addEventListener('input', render);

function applyMe(){
  document.getElementById('meName').textContent = me.displayName;
  const av = document.getElementById('meAvatar');
  if(me.avatarUrl){
    av.innerHTML = `<img src="${me.avatarUrl}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.textContent='${(me.displayName||'?').trim().charAt(0)}'">`;
  } else {
    av.textContent = (me.displayName || '?').trim().charAt(0);
  }
}

async function loadAdmins(){
  try{
    const res = await api({ action:'admins' });
    if(res.ok){ allAdmins = res.admins; refreshOwnerOptions(); }
  }catch(err){ /* ถ้าโหลดไม่ได้ dropdown จะมีแค่ทุกบัญชี/ยังไม่มีเจ้าของ */ }
}

function enterApp(){
  applyMe();
  document.getElementById('gate').classList.add('hidden');
  loadAdmins();
  load();
  startPolling();
}

async function tryLogin(){
  const val = document.getElementById('userInput').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if(!val){ err.textContent = 'กรุณาใส่ชื่อผู้ใช้'; return; }

  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  err.textContent = '';
  try{
    const res = await api({ action:'login', username: val });
    if(res.ok){
      me = { username: res.username, displayName: res.displayName, avatarUrl: res.avatarUrl || '' };
      enterApp();
    } else {
      err.textContent = res.message || 'ไม่พบชื่อผู้ใช้นี้';
    }
  }catch(e){
    err.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง';
  }finally{
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('userInput').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });

document.getElementById('logoutBtn').addEventListener('click', () => {
  stopPolling();
  me = null;
  document.getElementById('userInput').value = '';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('userInput').focus();
});

document.getElementById('userInput').focus();
</script>
